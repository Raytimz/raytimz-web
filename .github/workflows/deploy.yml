name: Validate, publish, and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  publish:
    needs: validate
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" \
            | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish deployment image
        env:
          IMAGE_REPOSITORY: ghcr.io/raytimz/raytimz-web
        run: |
          docker build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --tag "${IMAGE_REPOSITORY}:main" \
            --tag "${IMAGE_REPOSITORY}:${GITHUB_SHA}" \
            .
          docker push "${IMAGE_REPOSITORY}:main"
          docker push "${IMAGE_REPOSITORY}:${GITHUB_SHA}"

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://raytimz.com
    steps:
      - name: Configure Lightsail SSH
        env:
          LIGHTSAIL_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          for variable in LIGHTSAIL_KNOWN_HOSTS LIGHTSAIL_SSH_KEY; do
            if [ -z "${!variable}" ]; then
              echo "$variable is not configured." >&2
              exit 1
            fi
          done

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$LIGHTSAIL_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/lightsail"
          chmod 600 "$HOME/.ssh/lightsail"
          ssh-keygen -y -P '' -f "$HOME/.ssh/lightsail" > /dev/null
          printf '%s\n' "$LIGHTSAIL_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy the immutable website image
        env:
          DEPLOY_IMAGE: ghcr.io/raytimz/raytimz-web:${{ github.sha }}
          LIGHTSAIL_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          LIGHTSAIL_HOST="$(printf '%s\n' "$LIGHTSAIL_KNOWN_HOSTS" | awk 'NR == 1 { print $1 }')"
          if [ -z "$LIGHTSAIL_HOST" ]; then
            echo "Unable to resolve the host from LIGHTSAIL_KNOWN_HOSTS." >&2
            exit 1
          fi

          ssh \
            -i "$HOME/.ssh/lightsail" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "ec2-user@$LIGHTSAIL_HOST" \
            "DEPLOY_IMAGE='$DEPLOY_IMAGE' flock -w 600 /tmp/raytimz-deploy.lock bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd /home/ec2-user/raytimz-ops
          git switch main
          git pull --ff-only origin main
          sudo -n -H env WEB_IMAGE="$DEPLOY_IMAGE" \
            bash infrastructure/deploy/manual-deploy.sh --skip-git-pull
          REMOTE

      - name: Verify public routes
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 https://raytimz.com/ > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 2 https://www.raytimz.com/ > /dev/null
